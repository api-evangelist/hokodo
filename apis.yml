aid: hokodo
name: Hokodo
description: >-
  Hokodo is a London-based B2B payments and embedded trade-credit fintech that
  lets merchants and B2B marketplaces offer digital trade accounts and Buy Now,
  Pay Later at checkout. Buyers get instant credit decisions and flexible terms
  (30/60/90-day payment terms, instalments, and consolidated trade accounts)
  while Hokodo underwrites the credit risk, finances the invoice, and protects
  the merchant against non-payment. The platform is delivered through a
  versioned REST API (https://api.hokodo.co/v1/) covering companies, customers,
  credit offers, orders and payment plans, plus prebuilt Magento modules and a
  JavaScript SDK. Hokodo is backed by Anthemis and other investors and operates
  across the UK and Europe.
